[project]
name = "agentforge"
version = "1.0.0"
description = "Create, chat with, and automate AI agents — a production-ready AI agent platform."
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM117"]

[tool.ruff.format]
quote-style = "double"
